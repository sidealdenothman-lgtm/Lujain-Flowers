<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="تفاصيل منتجات لجين فلاورز">
    <title>تفاصيل المنتج | لجين فلاورز</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="product-details-page">

        <header class="catalog-header">
    <a id="back-to-catalog" class="back-to-catalog">
        ← العودة إلى الكتالوج
    </a>

    <img src="assets/logo.png"
         alt="Lujain Flowers"
         class="catalog-logo">

    <h1>تفاصيل المنتج</h1>
</header>
            <h1>تفاصيل المنتج</h1>
        </header>

        <section id="product-details">

            <div id="product-gallery">
                <img id="main-product-image"
                     src=""
                     alt="صورة المنتج">

                <div id="product-thumbnails"></div>
            </div>

            <div class="product-information">

                <h2 id="detail-product-name"></h2>

                <p id="detail-product-description"></p>

                <div class="product-sharing-actions">

    <a id="order-product-whatsapp"
       href="#"
       target="_blank">
        اطلب عبر واتساب
    </a>

    <button id="share-product-whatsapp" type="button">
        مشاركة المنتج عبر واتساب
    </button>

</div>

            </div>

        </section>
<!-- نافذة تكبير الصورة -->
<div id="image-lightbox" class="image-lightbox">
    <button id="close-lightbox" type="button">×</button>
    <img id="lightbox-image" src="" alt="صورة المنتج المكبرة">
</div>
        <p id="product-loading">جارٍ تحميل تفاصيل المنتج...</p>

    </main>

    <script type="module" src="js/product-details.js"></script>

</body>
</html>
