<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lujain Flowers - حيث تزهر المشاعر">
    <title>Lujain Flowers | حيث تزهر المشاعر</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="welcome-page">

        <!-- الزخارف العلوية -->
        <img src="assets/corner-top-left.png"
             class="decor decor-top-left" alt="" aria-hidden="true">

        <img src="assets/corner-top-right.png"
             class="decor decor-top-right" alt="" aria-hidden="true">

        <img src="assets/decor-top-center.png"
             class="decor decor-top-center" alt="" aria-hidden="true">

        <div class="welcome-content">

            <img src="assets/logo.png"
                 alt="Lujain Flowers"
                 class="main-logo">

            <p class="brand-slogan">حيث تزهر المشاعر</p>
<img src="assets/gold-line-1.png" class="gold-divider gold-line-1" alt="" aria-hidden="true">
            <h1>أهلاً بكم في عالم لجين فلاورز</h1>
<img src="assets/gold-line-2.png" class="gold-divider gold-line-2" alt="" aria-hidden="true">
            <h2>
                حيث تتحول الورود إلى لغة...
                والمشاعر إلى حكاية
            </h2>
<img src="assets/gold-line-3.png" class="gold-divider gold-line-3" alt="" aria-hidden="true">
           
            <p class="welcome-description">
                اكتشفوا تشكيلتنا من أجمل الباقات
                واختاروا ما يعبر عن مشاعركم
            </p>

            <div class="branch-chooser" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;">
                <a href="catalog.html?branch=branch1" class="explore-button">الفرع الأول</a>
                <a href="catalog.html?branch=branch2" class="explore-button">الفرع الثاني</a>
            </div>

        </div>

        <!-- الزخارف السفلية -->
        <img src="assets/corner-bottom-left.png"
             class="decor decor-bottom-left" alt="" aria-hidden="true">

        <img src="assets/corner-bottom-right.png"
             class="decor decor-bottom-right" alt="" aria-hidden="true">

        <img src="assets/decor-bottom-center.png"
             class="decor decor-bottom-center" alt="" aria-hidden="true">

    </main>

</body>
</html>
