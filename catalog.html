<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="كتالوج لجين فلاورز للورود والتنسيقات">

    <title>كتالوج لجين فلاورز</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="catalog-page">

        <header class="catalog-header">
<a
    href="admin-panel.html"
    id="admin-panel-link"
    style="display: none;"
>
    لوحة التحكم
</a>
            <img src="assets/logo.png"
                 alt="Lujain Flowers"
                 class="catalog-logo">

            <h1>كتالوج لجين فلاورز</h1>

            <p>اختاروا ما يعبّر عن أجمل مشاعركم</p>

        </header>

        <section class="categories-section">

            <h2>تصفّحوا أقسامنا</h2>
<div class="categories-grid"></div>
<a href="#" class="all-products-button">
    عرض كافة المنتجات
</a>
<!-- بيانات الفرع -->
<section class="branch-section" id="branch-section">

    <h2 id="branch-name">لجين فلاورز</h2>

    <p id="branch-address"></p>

    <div class="branch-actions">

        <a id="branch-whatsapp" href="#" target="_blank">
            تواصل معنا عبر واتساب
        </a>

        <a id="branch-map" href="#" target="_blank">
            موقعنا على الخريطة
        </a>

    </div>

    <div class="branch-payment">
    <h3>الدفع عبر شام كاش</h3>
    <img id="branch-qr" src="" alt="باركود شام كاش">
</div>

<!-- حسابات التواصل الاجتماعي -->
<div class="branch-social">
    <h3>تابعونا على مواقع التواصل الاجتماعي</h3>

    <div class="social-qr-container">

        <div class="social-qr-card">
    <h4>Facebook</h4>
    <a
        href="https://www.facebook.com/share/1VkZW3qohm/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="زيارة صفحة لجين فلاورز على فيسبوك"
    >
        <img
            src="assets/facebook-qr.png"
            alt="باركود صفحة لجين فلاورز على فيسبوك"
            loading="lazy"
        >
    </a>
</div>

<div class="social-qr-card">
    <h4>Instagram</h4>
    <a
        href="https://www.instagram.com/lujain_flowers2?utm_source=qr&evlk=MXRoMGptc2QxbWNndA=="
        target="_blank"
        rel="noopener noreferrer"
        aria-label="زيارة حساب لجين فلاورز على إنستغرام"
    >
        <img
            src="assets/instagram-qr.png"
            alt="باركود حساب لجين فلاورز على إنستغرام"
            loading="lazy"
        >
    </a>
</div>
    </div>
</div>

</section>

<!-- قسم عرض المنتجات -->
<section class="products-section" id="products-section">

   <h2 id="products-title">منتجاتنا</h2>

<!-- البحث عن المنتجات -->
<div class="product-search">
    <input
        type="search"
        id="product-search"
        placeholder="ابحث عن منتج أو نوع الورد..."
        autocomplete="off"
    >
</div>

<div class="products-grid" id="products-grid">
    <!-- ستظهر المنتجات هنا -->
</div>
</section>

    </main>
    <script type="module" src="js/catalog.js"></script>
</body>
</html>
