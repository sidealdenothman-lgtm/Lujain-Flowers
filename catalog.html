<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="كتالوج لجين فلاورز للورود والتنسيقات">

    <title>كتالوج لجين فلاورز</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="catalog-page">

        <header class="catalog-header">
<a
    href="admin.html"
    id="admin-panel-link"
    style="display: none;"
>
    لوحة التحكم
</a>
            <img src="assets/logo.png"
                 alt="Lujain Flowers"
                 class="catalog-logo">

            <h1>كتالوج لجين فلاورز</h1>

            <p>اختاروا ما يعبّر عن أجمل مشاعركم</p>

        </header>

        <section class="categories-section">

            <h2>تصفّحوا أقسامنا</h2>
<div class="categories-grid"></div>
<a href="#" class="all-products-button">
    عرض كافة المنتجات
</a>
<!-- بيانات الفرع -->
<section class="branch-section" id="branch-section">

    <h2 id="branch-name">لجين فلاورز</h2>

    <p id="branch-address"></p>

    <div class="branch-actions">

        <a id="branch-whatsapp" href="#" target="_blank">
            تواصل معنا عبر واتساب
        </a>

        <a id="branch-map" href="#" target="_blank">
            موقعنا على الخريطة
        </a>

    </div>

    <div class="branch-payment">
        <h3>الدفع عبر شام كاش</h3>
        <img id="branch-qr" src="" alt="باركود شام كاش">
    </div>

</section>

<!-- قسم عرض المنتجات -->
<section class="products-section" id="products-section">

    <h2 id="products-title">منتجاتنا</h2>

    <div class="products-grid" id="products-grid">
        <!-- ستظهر المنتجات هنا لاحقاً -->
    </div>

</section>

    </main>
    <script type="module" src="js/catalog.js"></script>
</body>
</html>
